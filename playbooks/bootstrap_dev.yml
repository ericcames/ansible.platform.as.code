---
- name: Bootstrap AAP Dev Environment
  hosts: all
  gather_facts: false
  # All variables are defined in inventories/rhdp-<customer>-<demo>/group_vars/all.yml
  # Run with: ansible-playbook -i inventories/rhdp-<customer>-<demo>/ playbooks/bootstrap_dev.yml

  tasks:

    - name: Assert controller environment variables are set
      ansible.builtin.assert:
        that:
          - aap_hostname != ''
          - aap_username != ''
          - aap_password != ''
        fail_msg:
          - "Controller credentials are not set."
          - "Run: export CONTROLLER_HOST / CONTROLLER_USERNAME / CONTROLLER_PASSWORD"

    - name: Create bootstrap token
      ansible.platform.token:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
        description: "bootstrap_dev token"
        scope: write
        state: present
      register: bootstrap_token

    - name: Run bootstrap tasks
      block:

        - name: Create Automation Hub - certified credential
          ansible.controller.credential:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "Automation Hub - certified"
            organization: Default
            credential_type: "Ansible Galaxy/Automation Hub API Token"
            inputs:
              url: "https://console.redhat.com/api/automation-hub/content/published/"
              auth_url: "{{ hub_auth_url }}"
              token: "{{ hub_token }}"
            state: present

        - name: Create Automation Hub - validated credential
          ansible.controller.credential:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "Automation Hub - validated"
            organization: Default
            credential_type: "Ansible Galaxy/Automation Hub API Token"
            inputs:
              url: "https://console.redhat.com/api/automation-hub/content/validated/"
              auth_url: "{{ hub_auth_url }}"
              token: "{{ hub_token }}"
            state: present

        - name: Associate Galaxy credentials with Default Organization
          ansible.controller.organization:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: Default
            galaxy_credentials:
              - "Automation Hub - certified"
              - "Automation Hub - validated"
            state: present

        - name: Create vault credential
          ansible.controller.credential:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "{{ my_vault }}"
            organization: Default
            credential_type: "Vault"
            inputs:
              vault_password: "{{ vault_password }}"
            state: present

        - name: Create aap.as.code project
          ansible.controller.project:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "aap.as.code"
            organization: Default
            scm_type: git
            scm_url: "https://github.com/ericcames/aap.as.code.git"
            scm_branch: main
            scm_update_on_launch: true
            wait: true
            state: present

        # ------------------------------------------------------------------
        # Give "AAP Credential" an OAuth token.
        #
        # The "Red Hat Ansible Automation Platform" credential type injects
        # aap_token as an EXTRA VAR (aap_token: "{{oauth_token}}"). With
        # oauth_token empty, aap_token arrives as "", every infra.aap_configuration
        # role resolves `controller_oauthtoken: "{{ aap_token | default(omit, true) }}"`
        # to omit, and ansible.controller modules fall back to username/password
        # auth -- which POSTs to /api/controller/v2/tokens/. AAP 2.6+ removed that
        # endpoint, so playbooks/main.yml dies with
        # "Failed to get token: HTTP Error 404: Not Found".
        #
        # Extra vars are the highest-precedence source in Ansible, so this CANNOT
        # be fixed from inside main.yml -- the token has to be on the credential.
        # ------------------------------------------------------------------

        - name: Find any previous CaC tokens
          ansible.builtin.uri:
            url: "{{ aap_hostname }}/api/gateway/v1/tokens/?description=AAP%20CaC%20token"
            headers:
              Authorization: "Bearer {{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
          register: previous_cac_tokens

        # Superseded tokens would otherwise accumulate one per bootstrap run.
        - name: Delete previous CaC tokens
          ansible.builtin.uri:
            url: "{{ aap_hostname }}/api/gateway/v1/tokens/{{ item.id }}/"
            method: DELETE
            headers:
              Authorization: "Bearer {{ bootstrap_token.ansible_facts.aap_token.token }}"
            status_code: [204, 404]
            validate_certs: "{{ aap_validate_certs }}"
          loop: "{{ previous_cac_tokens.json.results | default([]) }}"
          loop_control:
            label: "token {{ item.id }}"

        # Deliberately NOT deleted in the always: block below -- this token lives
        # inside AAP Credential and must outlive the bootstrap run. See CLAUDE.md.
        - name: Create the durable CaC token
          ansible.platform.token:
            aap_hostname: "{{ aap_hostname }}"
            aap_username: "{{ aap_username }}"
            aap_password: "{{ aap_password }}"
            aap_validate_certs: "{{ aap_validate_certs }}"
            description: "AAP CaC token"
            scope: write
            state: present
          register: cac_token

        # RHDP provisions "AAP Credential" into its own organization, so look the
        # organization up rather than assuming Default and creating a duplicate.
        - name: Look up the existing AAP Credential
          ansible.builtin.uri:
            url: "{{ aap_hostname }}/api/controller/v2/credentials/?name=AAP%20Credential"
            headers:
              Authorization: "Bearer {{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
          register: aap_credential_lookup

        - name: Give AAP Credential the CaC token
          ansible.controller.credential:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "AAP Credential"
            credential_type: "Red Hat Ansible Automation Platform"
            organization: >-
              {{ (aap_credential_lookup.json.results | first).summary_fields.organization.name
                 if aap_credential_lookup.json.count | int > 0 else 'Default' }}
            # inputs is replaced wholesale on update -- every field must be given,
            # or the omitted ones are injected as empty strings. Dropping
            # request_timeout makes main.yml fail with
            # "gateway_request_timeout ... cannot be converted to a float".
            inputs:
              host: "{{ aap_hostname }}"
              username: "{{ aap_username }}"
              password: "{{ aap_password }}"
              oauth_token: "{{ cac_token.ansible_facts.aap_token.token }}"
              request_timeout: "10"
              verify_ssl: "{{ aap_validate_certs }}"
            state: present

        - name: Create Setup - AAP - CAC job template
          ansible.controller.job_template:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "Setup - AAP - CAC"
            organization: Default
            inventory: "Demo Inventory"
            project: "aap.as.code"
            playbook: "playbooks/main.yml"
            credentials:
              - "{{ my_vault }}"
              - "AAP Credential"
            extra_vars:
              my_vault: "{{ my_vault }}"
              my_windows_catalog_short_description: "{{ my_windows_catalog_short_description }}"
              my_remote_vault: "{{ my_remote_vault }}"
              my_remote_ssh_pub_key: "{{ my_remote_ssh_pub_key }}"
            ask_variables_on_launch: false
            state: present

      always:

        - name: Delete bootstrap token
          ansible.platform.token:
            aap_hostname: "{{ aap_hostname }}"
            aap_token: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            aap_validate_certs: "{{ aap_validate_certs }}"
            existing_token: "{{ bootstrap_token.ansible_facts.aap_token }}"
            state: absent

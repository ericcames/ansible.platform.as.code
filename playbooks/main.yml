- name: Setup Ansible Automation Platform
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    my_organization: "IT Service Automation"
    my_aap_credential: "AAP Credential"
    my_remote_vault: ""
    aap_configuration_async_retries: 60
    aap_configuration_async_delay: 2
    controller_configuration_settings_secure_logging: true
    my_vault: ""
    timezone_id: America/Phoenix

  tasks:

    # fail with good error for Automation controller user
    - name: Determine that red hat automation platform credential exists
      ansible.builtin.assert:
        that:
          - "lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') !=''"
          - "lookup('ansible.builtin.env', 'CONTROLLER_HOST') !=''"
          - "lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') !=''"
        fail_msg:
          - "Red Hat Ansible Automation Platform credential is not set"
          - "Please assign correct credentials to the Job Template"

    - name: Create a new token
      ansible.platform.token:
        aap_hostname: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
        aap_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
        aap_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
        aap_validate_certs: false
        description: AAP Setup
        scope: write
        state: present

    # AAP 2.7 removed the controller OAuth token endpoints, so ansible.controller
    # modules can no longer mint their own token from username/password -- they 404
    # on /api/controller/v2/tokens/. Every infra.aap_configuration role wires the
    # token through as `controller_oauthtoken: "{{ aap_token | default(omit, true) }}"`,
    # so aap_token must be in scope inside the roles that dispatch includes. A `vars:`
    # entry on the dispatch include_role does not reach those nested roles, so set it
    # as a host fact. The modules accept the fact dict as-is.
    - name: Make the gateway token available to every dispatched role
      ansible.builtin.set_fact:
        aap_token: "{{ ansible_facts['aap_token'] }}"

    - name: Assert the token is in scope before dispatching
      ansible.builtin.assert:
        that:
          - aap_token is defined
          - aap_token.token is defined
        fail_msg: "aap_token fact missing - controller modules will fall back to the removed token endpoint"
        success_msg: "aap_token in scope"

    - name: Grab vault from remote url
      ansible.builtin.get_url:
        url: '{{ my_remote_vault }}'
        dest: files/config_as_code/remotevault.yml
        mode: '0644'

    - name: Include configurations
      ansible.builtin.include_vars:
        dir: files/config_as_code

    - name: Do stuff
      vars:
        meta_dependency_check: false  # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch

    - name: Remove my token
      ansible.platform.token:
        aap_hostname: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
        existing_token: "{{ ansible_facts['aap_token'] }}"
        aap_token: "{{ ansible_facts['aap_token']['token'] }}"
        aap_validate_certs: false
        state: absent
